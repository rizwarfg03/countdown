<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<title>Pemilihan Dosen Pembimbing</title>

<style>

body{
    margin:0;
    background:#0F172A;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{

    width:500px;
    text-align:center;
    background:#1E293B;
    border-radius:20px;
    padding:40px;

}

h1{

    margin-bottom:10px;

}

#clock{

    font-size:18px;
    color:#CBD5E1;

}

#countdown{

    font-size:70px;
    font-weight:bold;
    margin-top:30px;
    color:#38BDF8;

}

</style>

</head>

<body>

<div class="card">

<h1>Pemilihan Dosen Pembimbing</h1>

<p>Form akan dibuka dalam</p>

<div id="countdown">

Loading...

</div>

<p id="clock"></p>

</div>

<script>

//=========================
// GANTI SESUAI KEBUTUHAN
//=========================

const targetTime = new Date("2026-07-29T00:20:00+07:00").getTime();

const formURL =
"https://docs.google.com/forms/d/e/1FAIpQLScDg7x9OF5NytZekYzHa5t74LEYRzhaAHl3Ins_caUx31XbxQ/viewform";

//=========================

// Ambil waktu server

let serverOffset = 0;

async function syncTime(){

    const response = await fetch("https://worldtimeapi.org/api/timezone/Asia/Jakarta");

    const data = await response.json();

    const serverNow = new Date(data.datetime).getTime();

    const localNow = Date.now();

    serverOffset = serverNow-localNow;

}

function update(){

    const now = Date.now()+serverOffset;

    const distance = targetTime-now;

    document.getElementById("clock").innerHTML=
    "Jam Server : "+
    new Date(now).toLocaleTimeString("id-ID");

    if(distance<=0){

        document.getElementById("countdown").innerHTML=
        "Membuka Form...";

        window.location.href=formURL;

        return;

    }

    const h=Math.floor(distance/1000/60/60);

    const m=Math.floor(distance/1000/60)%60;

    const s=Math.floor(distance/1000)%60;

    document.getElementById("countdown").innerHTML=
    String(h).padStart(2,'0')+" : "+
    String(m).padStart(2,'0')+" : "+
    String(s).padStart(2,'0');

}

async function start(){

    await syncTime();

    setInterval(update,200);

}

start();

</script>

</body>

</html>
